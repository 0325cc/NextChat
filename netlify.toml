[[redirects]]
  from = "/api/*"
  to = "https://openrouter.ai/api/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, PUT, DELETE", Access-Control-Allow-Headers = "Authorization, Content-Type"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
